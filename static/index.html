<div class="app" id="app" data-mode="standard" data-view="home">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="side-brand">
      <img src="/static/img/logo.svg" alt="" class="logo" width="40" height="40">
      <div>
        <strong>DMFT Kanker</strong>
        <span id="sideTagline">AI Assistant</span>
      </div>
    </div>
    <button class="btn-new" id="sideNewChat" type="button"></button>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-section">
      <div class="side-heading" id="sideRecentTitle"></div>
      <div class="side-recent" id="sideRecent"></div>
    </div>
    <div class="side-account" id="sideAccount"></div>
  </aside>

  <div class="main">
    <header class="appbar" id="appbar"></header>
    <div class="offline-banner" id="offlineBanner" hidden></div>
    <main class="views" id="views">
      <section class="view" id="view-home" aria-labelledby="homeTitle"></section>
      <section class="view view-chat" id="view-chat" aria-label="Conversation">
        <div class="thread" id="thread" aria-live="polite"></div>
      </section>
      <section class="view" id="view-history"></section>
      <section class="view" id="view-knowledge"></section>
      <section class="view" id="view-projects"></section>
      <section class="view" id="view-reports"></section>
      <section class="view" id="view-profile"></section>
    </main>

    <div class="composer-wrap" id="composerWrap">
      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="composer-tool" id="attachBtn" aria-haspopup="dialog"><svg class="ic"><use href="#i-clip"/></svg></button>
        <label for="messageInput" class="sr-only" id="inputLabel">Your question</label>
        <textarea id="messageInput" rows="1" maxlength="2000" spellcheck="false" enterkeyhint="send"></textarea>
        <button type="button" class="composer-tool mic" id="micBtn" hidden><svg class="ic"><use href="#i-mic"/></svg></button>
        <button type="submit" class="send" id="sendButton"><svg class="ic"><use href="#i-send"/></svg></button>
      </form>
      <div class="composer-meta"><span id="disclaimer"></span><span id="charCount" hidden></span></div>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
  </div>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button type="button" class="icon-btn" id="sheetClose"><svg class="ic"><use href="#i-x"/></svg></button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="menu" id="menu" role="menu" hidden></div>

<section class="report" id="report" hidden aria-modal="true" role="dialog" aria-labelledby="reportTitle">
  <div class="report-toolbar">
    <button type="button" class="icon-btn" id="reportClose"><svg class="ic"><use href="#i-back"/></svg></button>
    <strong id="reportHeading"></strong>
    <div class="report-actions" id="reportActions"></div>
  </div>
  <div class="report-scroll"><article class="paper" id="reportPaper"></article></div>
</section>

<div class="toast-host" id="toastHost" aria-live="polite"></div>

<script src="/static/js/render.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
