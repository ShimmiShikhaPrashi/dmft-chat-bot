name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      # The suite uses a fake embedder and a fake LLM: no model download or API key needed.
      - name: Run tests
        run: python -m pytest -q

  demo:
    name: Demo search check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install
        working-directory: demo
        run: npm ci --no-audit --no-fund

      # The in-browser model (~120 MB) is downloaded once and cached between runs.
      - uses: actions/cache@v4
        with:
          path: demo/node_modules/@huggingface/transformers/.cache
          key: e5-small-q8-v1

      # Runs seed/eval.yaml through demo/engine.js on the committed snapshot (demo/kb), exactly as the
      # GitHub Pages demo answers.
      - name: Evaluate demo retrieval
        run: |
          pip install --quiet pyyaml
          mkdir -p demo/.build
          python -c "import json, yaml; json.dump(yaml.safe_load(open('seed/eval.yaml', encoding='utf-8')), open('demo/.build/eval.json', 'w', encoding='utf-8'), ensure_ascii=False)"
          cd demo && node eval.mjs

  image:
    name: Docker image (GHCR)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image bundles torch and the bge-m3 model (~2.3 GB); make room on the runner.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
