qa:
  - question_en: How many tehsils are there in Kanker district?
    question_hi: कांकेर ज़िले में कितनी तहसीलें हैं?
    answer_en: |-
      Uttar Bastar Kanker district has **7 tehsils**:
      1. Kanker
      2. Charama
      3. Narharpur
      4. Bhanupratappur
      5. Durgukondal
      6. Koyalibeda
      7. Antagarh
    answer_hi: |-
      उत्तर बस्तर कांकेर ज़िले में **7 तहसीलें** हैं:
      1. कांकेर
      2. चारामा
      3. नरहरपुर
      4. भानुप्रतापपुर
      5. दुर्गूकोंदल
      6. कोयलीबेड़ा
      7. अंतागढ़
